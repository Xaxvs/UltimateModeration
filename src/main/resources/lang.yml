# NEVER edit config-version, it is used to check if the file is up to date.
config-version: 1

# Please note that if you attempt to use placeholders in fields that do not support them, they will not work.
# For example, you cannot use {note-index} in the no-permission message, as it is not relevant to that message.
# If you use a placeholder in a message where it is not applicable, it will be displayed as-is.
# If you use a placeholder in a message where it is applicable, it will be replaced with the actual value.
# This applies to all placeholders in the messages section.
# below is a list of all placeholders that can be used in the messages section, along with their descriptions.
# {player} - The name of the player being acted upon.
# {staff} - The name of the staff member performing the action.
# {reason} - The reason for the action being performed.
# {duration} - The duration of the action being performed.
# {note-index} - The index of the note being acted upon.
# {warn-index} - The index of the warn being acted upon.
# {content-max-long} - The maximum length of content allowed for notes.
# {value} - A generic placeholder for any value being acted upon.
# {note-author} - The author of the note being acted upon.
# {warn-author} - The author of the warn being acted upon.
# {note-content} - The content of the note being acted upon.
# {warn-content} - The content of the warn being acted upon.
# {message} - A message that is sent.

messages:

  general:
    no-permission: '&cYou do not have permission to perform this command.'
    player-not-found: '&c{player} was not found or does not exist.'
    sender-not-valid: '&cYou cannot execute this command.'
    sender-not-player: '&cOnly players can execute this command!'
    content-too-long: '&cThe content is too long. Please keep it under {content-max-long} characters.'
    invalid-number: '&c{value} is not a valid number.'
    player-not-online: '&cThat player is not online.'
    invalid-duration: '&cInvalid duration. Examples: 2w or 2d or 1y'

  notes:
    command-usage: '&cUsage: /note <add|list|delete> <player>'
    add-command-usage: '&cUsage: /note add <player> <content>'
    delete-command-usage: '&cUsage: /note delete <player> <index>'
    no-delete-message-index: '&cYou must specify a message index to delete.'
    note-deleted: '&aDeleted note {note-index} for {player}.'
    note-added: '&aAdded note for {player}.'
    invalid-note-index: '&c{note-index} is not a valid note index for {player}.'
    note-must-have-content: '&cYou must provide content for the note.'
    no-notes: '&c{player} has no notes.'
    list-header: '&6Notes for {player}:'
    list-entry: '&7[{note-index}] Author: {note-author}, &f{note-content}'

  warnings:
    command-usage: '&cUsage: /warn <add|list|delete> <player>'
    add-command-usage: '&cUsage: /warn add <player> <reason>'
    delete-command-usage: '&cUsage: /warn delete <player> <index>'
    list-command-usage: '&cUsage: /warn list <player>'
    must-have-reason: '&cYou must specify a reason for warning {player}.'
    invalid-index: '&c{value} is not a valid warn index for {player}.'
    deleted: '&aDeleted warn {value} for {player}.'
    no-warns: '&c{player} has no warns.'
    list-header: '&6Warns for {player}:'
    list-entry: '&7[{value}] Author: {warn-author}, &f{warn-content}'
    added: '&aSuccessfully warned {player}.'

  kick:
    command-usage: '&cUsage: /kick <player> <reason>'
    must-have-reason: '&cYou must include a reason.'
    kicked-player: '&aYou have kicked {player} for {reason}.'

  mute:
    usage: '&cUsage: /mute <player> <reason>'
    must-have-reason: '&cYou must include a reason.'
    muted-player: '&aMuted {player} for {reason}.'
    player-muted: '&cYou are currently muted for {reason}. Your mute expires: {duration}.'
    unmute-usage: '&cUsage: /unmute <player>'
    player-not-muted: '&cThat player is not muted.'
    player-already-muted: '&cThat player is already muted.'
    player-unmuted: '&a{player} has been unmuted.'

  ban:
    usage: '&cUsage: /ban <player> <reason>'
    must-have-reason: '&cYou must include a reason.'
    banned-player: '&aYou have banned {player} for {reason}.'
    player-already-banned: '&c{player} is already banned.'
    unban-usage: '&cUsage: /unban <player>'
    unbanned-player: '&aYou have unbanned {player}.'
    player-not-banned: '&c{player} is not banned.'
    login-message: '&cYou have been banned by {staff} for: {reason} Duration: {duration}'

  tempmute:
    usage: '&cUsage: /tempmute <player> <duration> <reason>'
    muted-player: '&aYou have temp-muted {player} for {duration} for {reason}'

  tempban:
    usage: '&cUsage: /tempban <player> <duration> <reason>'
    banned-player: '&aYou have temp-banned {player} for {duration} for {reason}'

  freeze:
    usage: '&cUsage: /freeze <player>'
    title: '&cYou have been frozen!'
    freeze-bypass: '&cYou cannot freeze this player as they have the freeze bypass permission.'
    you-are-frozen: '&cYou have been frozen by {staff}. You cannot move or perform any actions.'
    subtitle: '&7You cannot move or perform any actions.'
    froze-player: '&aYou have frozen {player}.'
    player-already-frozen: '&cThat player is already frozen.'

  unfreeze:
    unfroze-player: '&aYou have unfrozen {player}.'
    you-are-unfrozen: '&aYou have been unfrozen by {staff}. You can now move and perform actions.'
    usage: '&cUsage: /unfreeze <player>'
    player-not-frozen: '&cThat player is not frozen.'

  staff-chat:
    usage: '&cUsage: /staffchat <message>'
    format: '&8[&cStaff&8] &f{staff}: &7{message}'